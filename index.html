
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acosta Basketball Tracker</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
    }
    .player {
      background: #202d42;
      padding: 25px;
      margin: 20px auto;
      border-radius: 16px;
      max-width: 400px;
    }
    .number {
      font-size: 60px;
      color: #ffcc33;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🏀 Acosta Basketball Tracker</h1>
  <p>Player Development & Statistics</p>

  <div class="player">
    <div class="number">#7</div>
    <h2>Ethan Acosta</h2>
    <p>Position: Point Guard (PG)</p>
    <p>Dominant Hand: Both</p>
  </div>

  <div class="player">
    <div class="number">#6</div>
    <h2>Eliam Acosta</h2>
    <p>Player Development Profile</p>
  </div>
</body>
</html>
